[tox]
requires =
    tox>=4.2
env_list =
    py{313, 312, 311}

[testenv]
deps =
    allianceauth
    django-webtest
    factory_boy
    fakeredis
    pytest
    pytest-cov
    pytest-django
set_env =
    DJANGO_SETTINGS_MODULE = testauth.settings.local
commands =
    pytest --cov=aa_doctrinehub --cov-report=xml --cov-report=html
install_command = python -m pip install -U {opts} {packages}

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
