[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[project]
name = "aa-doctrinehub"
description = "Doctrines, fittings and member compliance for Alliance Auth"
readme = "README.md"
keywords = [
    "aa_doctrinehub",
    "allianceauth",
    "doctrines",
    "eveonline",
    "fittings",
]
license = { file = "LICENSE" }
authors = [
    { name = "Maddog Broekman" },
]
requires-python = ">=3.11,<3.14"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = [
    "version",
]
dependencies = [
    "allianceauth>=5",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2",
    "django-webtest>=1.9.15",
    "factory-boy>=3.3.3",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-django>=4.11",
    "ruff>=0.11",
]

[tool.hatch]
version.path = "aa_doctrinehub/__init__.py"
build.include = [
    "/aa_doctrinehub",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "testauth",
]
lint.select = [ "E", "F", "I", "W", "B", "UP" ]
lint.ignore = []
lint.per-file-ignores."**/migrations/*" = [ "E501" ]
lint.isort.combine-as-imports = true

[tool.mypy]
ignore_missing_imports = true
python_version = "3.12"
plugins = [ "mypy_django_plugin.main" ]
exclude = [ "testauth/", "migrations/" ]

[tool.django-stubs]
django_settings_module = "testauth.settings.local"
